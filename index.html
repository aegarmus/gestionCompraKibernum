<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous"
    >

    <link rel="stylesheet" href="assets/css/main.css">

    <script
        defer 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
        crossorigin="anonymous"
    ></script>

    <script src="assets/js/main.js" defer></script>
</head>
<body>
    <div class="container py-4">

        <header class="d-flex flex-wrap align-items-center justify-content-between mb-4">
            <div>
                <h1 class="h3 mb-1">Kibernum Store</h1>
                <p class="text-muted mb-0">Gestión de productos, compra venta y gatos en un carrito</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary btn-sm" id="btnResetData">Reset Datos</button>
                <button class="btn btn-outline-primary btn-sm" id="btnDemoBuy">Compra Demo</button>
            </div>
        </header>

        <div class="row g-3">
            <!--seccion izquierda: buscador y productos-->
            <section class="col-12 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex flex-wrap gap-2 align-items-center justify-content-between">
                            <div class="flex-grow-1">
                                <label class="form-label mb-1">Buscar</label>
                                <input id="searchInput" class="form-control" placeholder="Buscar por nombre" />
                            </div>
                            <div class="category-width">
                                <label class="form-label mb-1">Categoría</label>
                                <select id="categoryFilter" class="form-select">
                                    <option value="ALL">Todas</option>
                                </select>
                            </div>
                            <div class="order-width">
                                <label class="form-label mb-1">Orden</label>
                                <select id="orderFilter" class="form-select">
                                    <option value="NAME_ASC">Nombre (A-Z)</option>
                                    <option value="NAME_DESC">Nombre (Z-A)</option>
                                    <option value="PRICE_ASC">Precio (menor → mayor)</option>
                                    <option value="PRICE_DESC">Precio (mayor → menor)</option>
                                    <option value="STOCK_ASC">Stock (menor → mayor)</option>
                                    <option value="STOCK_DESC">Stock (mayor → menor)</option>
                                </select>
                            </div>

                            <hr class="my-3">

                            <div class="table-responsive">
                                <table class="table table-sm align-middle">
                                    <thead>
                                        <tr>
                                            <th>Producto</th>
                                            <th>Categoría</th>
                                            <th class="text-end">Precio</th>
                                            <th class="text-end">Stock</th>
                                            <th class="text-end">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="productsTBody">
                                        <!--Cargaremos productos con Javascript-->
                                    </tbody>
                                </table>
                            </div>

                        </div>
                    </div>
                </div>
            </section>

            <!--Panel derecho Form - Carrito -Caja de pago-->
            <section class="col-12 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Crear Producto</h2>

                        <form id="productForm" class="vstack gap-2">
                            <div>
                                <label class="form-label mb-1">Nombre</label>
                                <input 
                                    type="text" 
                                    id="nameInput" 
                                    class="form-control" 
                                    required 
                                    minlength="2" 
                                    placeholder="Ingresa el nombre del producto"
                                >
                            </div>

                            <div>
                                <label class="form-label mb-1">Categoría</label>
                                <input 
                                    type="text" 
                                    id="categoryInput" 
                                    class="form-control" 
                                    required 
                                    minlength="2" 
                                    placeholder="Ingresa una categoria"
                                >
                            </div>

                            <div class="row g-2">
                                <div class="col-6">
                                    <label class="form-label mb-1">Precio (CLP)</label>
                                    <input 
                                        type="number" 
                                        id="priceInput" 
                                        class="form-control" 
                                        required 
                                        min="10"
                                        step="10" 
                                        placeholder="Ingresa un precio en CLP"
                                    >
                                </div>
                                <div class="col-6">
                                    <label class="form-label mb-1">Stock</label>
                                    <input 
                                        type="number" 
                                        id="stockInput" 
                                        class="form-control" 
                                        required 
                                        min="0"
                                        step="1" 
                                        placeholder="Ingresa el stock disponible"
                                    >
                                </div>

                                <div class="d-flex gap-2 mt-2">
                                    <button 
                                        class="btn btn-primary flex-grow-1" 
                                        type="submit" 
                                        id="submitBtn"
                                    >Guardar</button>

                                    <button
                                        class="btn btn-outline-secondary"
                                        type="button"
                                        id="cancelEditBtn"
                                        disabled
                                    >Cancelar</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <h2 class="h5 mb-0">Carrito</h2>
                            <button id="btnClearCart" class="btn btn-outline-danger btn-sm">Vaciar</button>
                        </div>

                        <div class="mt-3">
                            <ul id="cartList" class="list-group list-group-flush">
                                <!--Aquí van los productos que escojamos, se ingresaran con Javascript-->
                                
                            </ul>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">
                            <span class="text-muted">Subtotal</span>
                            <span id="subtotalOut" class="text-bold">$0</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-muted">IVA (19%)</span>
                            <span id="ivaOut" class="text-bold">$0</span>
                        </div>
                        <div class="d-flex justify-content-between fs-5 mt-1">
                            <span >Total</span>
                            <span id="totalOut" class="text-bold">$0</span>
                        </div>

                        <button id="btnCheckOut" class="btn btn-success w-100 mt-3">Finalizar Compra</button>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 mb-2">Caja</h2>
                        <div class="d-flex justify-content-between">
                            <span class="text-muted">Ingresos Ventas</span>
                            <span id="subtotalOut" class="text-bold">$0</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-muted">Gastos</span>
                            <span id="subtotalOut" class="text-bold">$0</span>
                        </div>
                        <div class="d-flex justify-content-between fs-5 mt-1">
                            <span >Balance</span>
                            <span id="subtotalOut" class="text-bold">$0</span>
                        </div>

                        <div class="row g-2 mt-3">
                            <div class="col-6">
                                <button id="btnAddExpenseDemo" class="btn btn-outline-dark btn-sm w-100">Gasto demo</button>
                            </div>
                            <div class="col-6">
                                <button id="btnResetCash" class="btn btn-outline-secondary btn-sm w-100">Reset caja</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <footer class="text-center text-muted small mt-4">
            Kibernum Store - JS Vanilla - Bootstrap - DOM
        </footer>
    </div>
</body>
</html>
